name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node scripts/check-palette.mjs
        working-directory: web
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go vet ./... && go test ./...
      - name: cross-build every release target
        run: |
          set -e
          for t in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/arm64 darwin/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} GOARM=6 go build -o /dev/null ./cmd/agent
          done
          go build -o /dev/null ./cmd/hub
