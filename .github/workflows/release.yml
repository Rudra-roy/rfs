name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: cross-compile
        run: |
          set -e; mkdir -p out
          for t in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            [ "$arch" = arm ] && export GOARM=6 && name=armv6l || name=$arch
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "out/rfs-agent-$os-$name$ext" ./cmd/agent
            [ "$os" = linux ] && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "out/rfs-hub-$os-$name" ./cmd/hub || true
          done
          (cd out && sha256sum * > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes --title "$GITHUB_REF_NAME"
        env: { GH_TOKEN: "${{ github.token }}" }
