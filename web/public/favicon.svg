<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b353f"/><stop offset="1" stop-color="#18212b"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#394552"/><stop offset="1" stop-color="#222b35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b13b" stop-opacity="0.9"/><stop offset="1" stop-color="#f0b13b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#plate)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- rails -->
  <rect x="9" y="12" width="4" height="40" rx="1.5" fill="#0f1821" opacity="0.9"/>
  <rect x="51" y="12" width="4" height="40" rx="1.5" fill="#0f1821" opacity="0.9"/>
  <!-- three units -->
  <g>
    <rect x="15" y="14" width="34" height="9" rx="2.5" fill="url(#unit)"/>
    <rect x="15.5" y="14.5" width="33" height="8" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="15" y="27.5" width="34" height="9" rx="2.5" fill="url(#unit)"/>
    <rect x="15.5" y="28" width="33" height="8" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="15" y="41" width="34" height="9" rx="2.5" fill="url(#unit)"/>
    <rect x="15.5" y="41.5" width="33" height="8" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>
  <!-- bay slits -->
  <g fill="#0f1821" opacity="0.8">
    <rect x="19" y="17.5" width="14" height="2" rx="1"/>
    <rect x="19" y="31" width="14" height="2" rx="1"/>
    <rect x="19" y="44.5" width="14" height="2" rx="1"/>
  </g>
  <!-- LEDs: top lit amber, others idle -->
  <circle cx="43.5" cy="18.5" r="7" fill="url(#glow)"/>
  <circle cx="43.5" cy="18.5" r="2.4" fill="#f0b13b"/>
  <circle cx="43.5" cy="32" r="2.4" fill="#5ac0ab" opacity="0.9"/>
  <circle cx="43.5" cy="45.5" r="2.4" fill="#5d6675" opacity="0.7"/>
</svg>
